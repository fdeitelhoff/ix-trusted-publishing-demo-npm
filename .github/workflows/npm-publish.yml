name: npm Trusted Publishing
on:
  release:
    types: [published]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check release metadata
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const p = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_NAME, `v${p.version}`);
          assert.equal(p.repository.url,
            `git+https://github.com/${process.env.GITHUB_REPOSITORY}.git`);
          assert.ok(!p.name.includes('replace-me'), 'Replace the npm scope first');
          JS

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Select documented npm CLI version
        run: npm install --global npm@12.2.0 --ignore-scripts
      - run: npm --version
      - name: Publish via OIDC
        run: npm publish --access public --ignore-scripts
